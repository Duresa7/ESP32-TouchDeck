[package]
name = "td-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
inventory = "0.3"
tokio = { version = "1", features = ["rt", "process", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
keyring = "4"
ts-rs = { version = "11", features = ["serde-json-impl"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
resvg = { version = "0.45", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
td-core = { workspace = true, features = ["ts"] }
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4.0"
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

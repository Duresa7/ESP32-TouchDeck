[package]
name = "td-host"
version = "1.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
base64 = "0.22"
flate2 = "1"
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
inventory = "0.3"
keyring = "4"
ts-rs = { version = "11", features = ["serde-json-impl"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
resvg = { version = "0.45", default-features = false }
# The parser resvg uses; SVGs are parsed here first so DTDs and node counts are bounded.
roxmltree = "0.20"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
td-core = { workspace = true, features = ["ts"] }
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-core = "0.62"
windows-future = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[package]
name = "td-companion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-hooks = ["dep:reqwest", "dep:tokio-tungstenite", "dep:tempfile"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
td-core = { workspace = true, features = ["ts"] }
td-host.workspace = true
td-link.workspace = true
image = { version = "0.25", default-features = false }
ts-rs = { version = "11", features = ["serde-json-impl"] }
inventory = "0.3"
getrandom = "0.3"
semver = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
futures-util = "0.3"
dirs = "6"
serialport = "4"
serde_urlencoded = "0.7"
thiserror = "2"
fs2 = "0.4"
hyper-util = { version = "0.1", features = ["http1", "server-auto", "server-graceful", "service", "tokio"] }
parking_lot = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
td-companion = { path = ".", features = ["test-hooks"] }

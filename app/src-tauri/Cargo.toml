[package]
name = "touchdeck"
version = "0.2.0"
description = "TouchDeck desktop app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "touchdeck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
keyring = "4"
reqwest = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "~2.12.0"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
td-core.workspace = true
td-host.workspace = true
td-link.workspace = true

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
# Compiles only the ignored HTTPS fixture test; no runtime hooks or WebDriver.
updater-fixture = []

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

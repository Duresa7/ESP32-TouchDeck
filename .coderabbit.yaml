# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false

  pre_merge_checks:
    # The project keeps comments for the why only, so docstring coverage isn't a goal.
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional Commits: `type: description` or `type(scope): description`,
        lowercase and imperative, with no trailing period. Mark breaking changes with `!`.
    # Warnings until they prove accurate on real PRs; then they move to error.
    # Companion routes have no check here. td-companion's contract test fails CI when api.gen.ts
    # is stale or docs/companion-api.md misses an endpoint, event or error code, and the
    # app/crates path instruction below flags other drift from that doc.
    custom_checks:
      - name: "Wire and Layout contracts change on every side"
        mode: warning
        instructions: >-
          The Link protocol is specified in schema/protocol/*.md. The Layout format is specified in
          schema/layout.schema.json and schema/README.md, and schema/check-layouts.mjs is its
          reference validator. Both are implemented in Rust (app/crates/td-core, app/crates/td-link),
          TypeScript (app/ui/src/lib/editor and app/src/lib/editor validators) and C
          (firmware/components/td_link, firmware/components/td_layout). If this PR changes a message,
          field, capability, error reason or Layout rule in any of these files, fail unless every
          other file above that covers the same contract, and the shared fixtures in schema/examples
          and schema/protocol/*.json, are updated to match, or the PR description explains why one
          needs no change. Pass if no contract changes.
      - name: "No private data"
        mode: warning
        instructions: >-
          This repository is public. Fail if added lines in any file, the PR title or the PR
          description contain: a Windows user-folder path with a real user name (C:\Users\<name>);
          an email address other than noreply or example.com addresses; a hostname of a real machine;
          a real IP address (127.0.0.1, localhost and the documentation ranges 192.0.2.0/24,
          198.51.100.0/24 and 203.0.113.0/24 are fine); or a password, token, API key, signing key or
          Wi-Fi credential. The maintainer's name is fine. Report each match by file, line and kind
          (for example "email address" or "API token") only; never include any part of the value.

  path_filters:
    - "!app/ui/src/companion/api.gen.ts"
    - "!app/ui/src/companion/api.test.gen.ts"
    - "!**/pnpm-lock.yaml"
    - "!**/Cargo.lock"
    - "!firmware/components/ui/fonts/**"
    - "!app/src/assets/fonts/**"

  path_instructions:
    - path: "app/ui/**"
      instructions: >-
        Colors, spacing and overlay layers come from the tokens in tokens.css; flag raw colors.
    - path: "app/crates/**"
      instructions: >-
        The Companion API is documented in docs/companion-api.md; flag behavior that drifts from it.
        Treat Device data, uploads and hub responses as untrusted input.
    - path: "firmware/**"
      instructions: >-
        Firmware runs on an ESP32-S3 with LVGL. Watch for unbounded allocation, blocking calls
        on the UI task, and wire behavior that drifts from schema/protocol/link-v2.md.
    - path: "schema/**"
      instructions: >-
        The protocol and Layout schema are shared by the Rust Companion, the TypeScript UI and the
        C Firmware; a change here usually needs matching changes on every side.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/adr/*.md"

chat:
  art: false

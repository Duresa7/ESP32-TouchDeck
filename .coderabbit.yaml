# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false

  pre_merge_checks:
    # The project keeps comments for the why only, so docstring coverage isn't a goal.
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional Commits: `type: description` or `type(scope): description`,
        lowercase and imperative, with no trailing period. Mark breaking changes with `!`.
    # Warnings until they prove accurate on real PRs; then they move to error.
    custom_checks:
      - name: "Copy matches docs/copy.md"
        mode: warning
        instructions: >-
          Look only at user-visible text that this PR adds or changes: strings rendered by the UI in
          app/ui/src or drawn by the Firmware in firmware/components/ui and firmware/components/td_ui_core.
          Ignore tests, fixtures, log lines, developer-only errors and code identifiers.
          Fail if a changed user-visible string is neither present in docs/copy.md nor added to
          docs/copy.md by this PR, or if it uses a term that GLOSSARY.md says to avoid. Name each
          string and its file. Pass if the PR changes no user-visible text. If you can't tell whether
          a string is user-visible, pass and say so.
      - name: "No AI attribution for project agents"
        mode: warning
        instructions: >-
          Fail if the PR title, PR description, any commit message, or any added file content credits
          an AI coding agent with the work. Examples: Co-Authored-By trailers naming Claude, Anthropic,
          Codex, ChatGPT, OpenAI, Gemini or Copilot; "Generated with" or "Created with" lines naming an
          AI tool; robot-emoji signatures. Exempt: CodeRabbit's own commits, suggestions and comments.
          Also exempt: product or code references to these names that aren't attribution, such as an
          integration that lists AI providers. Quote the offending line.
      - name: "Wire and API contracts change on every side"
        mode: warning
        instructions: >-
          The Link protocol and Layout schema are shared by three implementations: Rust
          (app/crates/td-core, app/crates/td-link), TypeScript (app/ui/src/lib/editor and
          app/src/lib/editor validators) and C (firmware/components/td_link, firmware/components/td_layout).
          If this PR changes a message, field, capability, error reason or Layout rule in
          schema/protocol/*.md, schema/*.json or any one of those implementations, fail unless the
          other implementations and the shared fixtures are updated to match, or the PR description
          explains why a side needs no change. Separately, if it adds or changes a Companion route or
          its request or response shape in app/crates/td-companion, fail unless docs/companion-api.md
          is updated and app/ui/src/companion/api.gen.ts is regenerated. Pass if no contract changes.
      - name: "No private data"
        mode: warning
        instructions: >-
          This repository is public. Fail if added lines in any file, the PR title or the PR
          description contain: a Windows user-folder path with a real user name (C:\Users\<name>);
          an email address other than noreply or example.com addresses; a hostname of a real machine;
          a real IP address (127.0.0.1, localhost and the documentation ranges 192.0.2.0/24,
          198.51.100.0/24 and 203.0.113.0/24 are fine); or a password, token, API key, signing key or
          Wi-Fi credential. The maintainer's name is fine. Report each match by file, line and kind
          (for example "email address" or "API token") only; never include any part of the value.

  path_filters:
    - "!app/ui/src/companion/api.gen.ts"
    - "!app/ui/src/companion/api.test.gen.ts"
    - "!**/pnpm-lock.yaml"
    - "!**/Cargo.lock"
    - "!firmware/components/ui/fonts/**"
    - "!app/src/assets/fonts/**"

  path_instructions:
    - path: "app/ui/**"
      instructions: >-
        Check user-facing strings against docs/copy.md and terms against GLOSSARY.md.
        Colors, spacing and overlay layers come from the tokens in tokens.css; flag raw colors.
    - path: "app/crates/**"
      instructions: >-
        The Companion API is documented in docs/companion-api.md; flag behavior that drifts from it.
        Treat Device data, uploads and hub responses as untrusted input.
    - path: "firmware/**"
      instructions: >-
        Firmware runs on an ESP32-S3 with LVGL. Watch for unbounded allocation, blocking calls
        on the UI task, and wire behavior that drifts from schema/protocol/link-v2.md.
    - path: "schema/**"
      instructions: >-
        The protocol and Layout schema are shared by the Rust Companion, the TypeScript UI and the
        C Firmware; a change here usually needs matching changes on every side.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "GLOSSARY.md"
      - "docs/copy.md"
      - "docs/design.md"
      - "docs/adr/*.md"

chat:
  art: false

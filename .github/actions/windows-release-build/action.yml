name: windows release build
description: Build and verify the TouchDeck Windows installer and matching radio-free firmware.

inputs:
  release-mode:
    description: Build mode (test-signing, dry-run, or publish)
    required: true
  release-tag:
    description: Release tag when publishing
    required: false
    default: ""
  build-ref:
    description: Git ref being built
    required: true
  updater-public-key:
    description: Tauri updater public key for durable-key builds
    required: false
    default: ""
  signing-key-present:
    description: Whether TAURI_SIGNING_PRIVATE_KEY is configured
    required: false
    default: "false"
  signing-private-key:
    description: Tauri updater private key for durable-key builds
    required: false
    default: ""
  signing-private-key-password:
    description: Password for the Tauri updater private key
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: app/package.json

    - name: Validate release identity
      shell: pwsh
      env:
        RELEASE_MODE: ${{ inputs.release-mode }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        UPDATER_PUBLIC_KEY: ${{ inputs.updater-public-key }}
        # Booleans only: the secrets themselves stay in the signing step.
        SIGNING_KEY_PRESENT: ${{ inputs.signing-key-present }}
      run: |
        $ErrorActionPreference = 'Stop'
        git diff --exit-code
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        if ($env:RELEASE_MODE -eq 'publish') {
          python app/scripts/release_version.py check --tag $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'The tag must be v plus the app version, and every app version must agree.' }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw "Tagged commit $(git rev-parse HEAD) is not on origin/main." }
        } else {
          python app/scripts/release_version.py check
          if ($LASTEXITCODE) { throw 'Every app version must agree.' }
          if ($env:RELEASE_MODE -eq 'dry-run') {
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE) { throw "Dry-run commit $(git rev-parse HEAD) is not on origin/main." }
          }
        }
        if ($env:RELEASE_MODE -ne 'test-signing') {
          if ($env:SIGNING_KEY_PRESENT -ne 'true') { throw 'Secret TAURI_SIGNING_PRIVATE_KEY is not configured.' }
          if (-not $env:UPDATER_PUBLIC_KEY) { throw 'Variable TAURI_UPDATER_PUBLIC_KEY is not configured.' }
        }

    - name: Write release notes and updater public key
      shell: pwsh
      env:
        RELEASE_MODE: ${{ inputs.release-mode }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        BUILD_REF: ${{ inputs.build-ref }}
        UPDATER_PUBLIC_KEY: ${{ inputs.updater-public-key }}
      run: |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
        $notes = ''
        if ($env:RELEASE_MODE -eq 'publish') {
          # Re-fetch the tag itself: the checkout can leave a lightweight copy without its message.
          git fetch --force --no-tags origin "+refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ref = "refs/tags/$env:RELEASE_TAG"
          if ((git for-each-ref $ref --format='%(objecttype)') -eq 'tag') {
            # Subject and body only, so a signed tag's signature block never reaches the notes.
            $notes = ((git for-each-ref $ref --format='%(contents:subject)%0a%0a%(contents:body)') -join "`n").Trim()
          }
          if (-not $notes) { $notes = "TouchDeck $env:RELEASE_TAG" }
        } elseif ($env:RELEASE_MODE -eq 'dry-run') {
          $notes = "TouchDeck dry run of $env:BUILD_REF ($(git rev-parse HEAD)). Not for publication."
        } else {
          $notes = "TouchDeck test-signing candidate $(git rev-parse HEAD). Not for publication."
        }
        [IO.File]::WriteAllText("$env:RUNNER_TEMP/release-notes.md", "$notes`n")
        if ($env:RELEASE_MODE -ne 'test-signing') {
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/updater.pub", "$($env:UPDATER_PUBLIC_KEY.Trim())`n")
        }
        Get-Content "$env:RUNNER_TEMP/release-notes.md"

    - name: Install locked build dependencies on disposable runner
      shell: pwsh
      run: |
        pnpm --dir app install --frozen-lockfile
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        git clone --branch v6.1 --recursive --depth 1 https://github.com/espressif/esp-idf.git "$env:RUNNER_TEMP/esp-idf"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        & "$env:RUNNER_TEMP/esp-idf/install.ps1" esp32s3
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: Build test-signed installer and matching radio-free firmware
      if: inputs.release-mode == 'test-signing'
      shell: pwsh
      run: |
        . "$env:RUNNER_TEMP/esp-idf/export.ps1"
        python app/scripts/package_windows.py build --out "$env:RUNNER_TEMP/touchdeck-release" --test-signing --notes-file "$env:RUNNER_TEMP/release-notes.md"
        exit $LASTEXITCODE

    - name: Build durable-key installer and matching radio-free firmware
      if: inputs.release-mode != 'test-signing'
      shell: pwsh
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-private-key-password }}
      run: |
        . "$env:RUNNER_TEMP/esp-idf/export.ps1"
        python app/scripts/package_windows.py build --out "$env:RUNNER_TEMP/touchdeck-release" --public-key-file "$env:RUNNER_TEMP/updater.pub" --notes-file "$env:RUNNER_TEMP/release-notes.md"
        exit $LASTEXITCODE

    - name: Verify signed installer with local HTTPS fixture without installing
      shell: pwsh
      run: |
        python app/scripts/verify_updater.py --assets "$env:RUNNER_TEMP/touchdeck-release/release-assets" --out "$env:RUNNER_TEMP/updater-fixture" --cargo-target "$env:RUNNER_TEMP/touchdeck-release/build/app" --openssl 'C:/Program Files/Git/usr/bin/openssl.exe'
        exit $LASTEXITCODE

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: windows-release-assets
        path: ${{ runner.temp }}/touchdeck-release/release-assets
        if-no-files-found: error
        retention-days: ${{ inputs.release-mode == 'publish' && 90 || 14 }}

name: windows release build
description: Build the Open TouchDeck Windows installer with the Companion and matching radio-free Firmware, unsigned for isolated release signing or test-signed for candidates.

inputs:
  release-mode:
    description: Build mode (test-signing, dry-run, or publish)
    required: true
  release-tag:
    description: Release tag when publishing
    required: false
    default: ""
  build-ref:
    description: Git ref being built
    required: true
  updater-public-key:
    description: Updater public key for durable-key builds
    required: false
    default: ""
  artifact-name:
    description: Workflow artifact for the release assets
    required: true

outputs:
  installer-sha256:
    description: SHA256 of the unsigned installer
    value: ${{ steps.digest.outputs.sha256 }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: app/package.json

    - name: Test packaging environment isolation
      shell: pwsh
      run: python -B -m unittest discover -s app/scripts/tests -p test_package_environment.py

    - name: Validate release identity
      shell: pwsh
      env:
        RELEASE_MODE: ${{ inputs.release-mode }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        UPDATER_PUBLIC_KEY: ${{ inputs.updater-public-key }}
      run: |
        $ErrorActionPreference = 'Stop'
        git diff --exit-code
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        if ($env:RELEASE_MODE -eq 'publish') {
          python app/scripts/release_version.py check --tag $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'The tag must be v plus the app version, and every app version must agree.' }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw "Tagged commit $(git rev-parse HEAD) is not on origin/main." }
        } else {
          python app/scripts/release_version.py check
          if ($LASTEXITCODE) { throw 'Every app version must agree.' }
          if ($env:RELEASE_MODE -eq 'dry-run') {
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE) { throw "Dry-run commit $(git rev-parse HEAD) is not on origin/main." }
          }
        }
        if ($env:RELEASE_MODE -ne 'test-signing') {
          if (-not $env:UPDATER_PUBLIC_KEY) { throw 'Variable TAURI_UPDATER_PUBLIC_KEY is not configured.' }
        }

    - name: Write release notes and updater public key
      shell: pwsh
      env:
        RELEASE_MODE: ${{ inputs.release-mode }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        BUILD_REF: ${{ inputs.build-ref }}
        UPDATER_PUBLIC_KEY: ${{ inputs.updater-public-key }}
      run: |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
        $notes = ''
        if ($env:RELEASE_MODE -eq 'publish') {
          # Re-fetch the tag itself: the checkout can leave a lightweight copy without its message.
          git fetch --force --no-tags origin "+refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ref = "refs/tags/$env:RELEASE_TAG"
          if ((git for-each-ref $ref --format='%(objecttype)') -eq 'tag') {
            # Subject and body only, so a signed tag's signature block never reaches the notes.
            $notes = ((git for-each-ref $ref --format='%(contents:subject)%0a%0a%(contents:body)') -join "`n").Trim()
          }
          if (-not $notes) { $notes = "Open TouchDeck $env:RELEASE_TAG" }
        } elseif ($env:RELEASE_MODE -eq 'dry-run') {
          $notes = "Open TouchDeck dry run of $env:BUILD_REF ($(git rev-parse HEAD)). Not for publication."
        } else {
          $notes = "Open TouchDeck test-signing candidate $(git rev-parse HEAD). Not for publication."
        }
        [IO.File]::WriteAllText("$env:RUNNER_TEMP/release-notes.md", "$notes`n")
        if ($env:RELEASE_MODE -ne 'test-signing') {
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/updater.pub", "$($env:UPDATER_PUBLIC_KEY.Trim())`n")
        }
        Get-Content "$env:RUNNER_TEMP/release-notes.md"

    - name: Install locked build dependencies on disposable runner
      shell: pwsh
      run: |
        pnpm --dir app install --frozen-lockfile
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        git clone --branch v6.1 --recursive --depth 1 https://github.com/espressif/esp-idf.git "$env:RUNNER_TEMP/esp-idf"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        & "$env:RUNNER_TEMP/esp-idf/install.ps1" esp32s3
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: Build test-signed installer and matching radio-free Firmware
      if: inputs.release-mode == 'test-signing'
      shell: pwsh
      run: |
        . "$env:RUNNER_TEMP/esp-idf/export.ps1"
        python app/scripts/package_windows.py build --out "$env:RUNNER_TEMP/touchdeck-release" --test-signing --notes-file "$env:RUNNER_TEMP/release-notes.md"
        exit $LASTEXITCODE

    - name: Build unsigned installer and matching radio-free Firmware
      if: inputs.release-mode != 'test-signing'
      shell: pwsh
      run: |
        . "$env:RUNNER_TEMP/esp-idf/export.ps1"
        python app/scripts/package_windows.py build --out "$env:RUNNER_TEMP/touchdeck-release" --public-key-file "$env:RUNNER_TEMP/updater.pub" --notes-file "$env:RUNNER_TEMP/release-notes.md"
        exit $LASTEXITCODE

    - name: Export installer hash
      id: digest
      shell: pwsh
      run: |
        $manifest = Get-Content "$env:RUNNER_TEMP/touchdeck-release/release-assets/release-manifest.json" -Raw | ConvertFrom-Json
        "sha256=$($manifest.installer_sha256)" >> $env:GITHUB_OUTPUT

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/touchdeck-release/release-assets
        if-no-files-found: error
        retention-days: ${{ inputs.release-mode == 'publish' && 90 || 14 }}

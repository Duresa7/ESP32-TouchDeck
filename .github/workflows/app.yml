name: app

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag on main to check (empty means the triggering ref)
        type: string
        default: ""
      os:
        description: JSON list of runners
        type: string
        default: '["windows-latest", "ubuntu-24.04"]'
      e2e:
        description: Run the UI e2e specs on the fake Companion
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Python on Windows decodes tool output with the ANSI code page unless told to use UTF-8.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify an explicit ref is on main
        if: inputs.ref != ''
        shell: pwsh
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw 'An explicit app ref must be a commit on origin/main.' }

      # Windows builds Rust on a Dev Drive: ReFS, with Defender scanning it asynchronously.
      # It mounts beside the checkout so the drive's protected System Volume Information folder stays out of the Rust cache.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 25GB
          drive-path: ${{ runner.temp }}/dev-drive.vhdx
          mount-path: ${{ github.workspace }}/../dev-drive
          trusted-dev-drive: true
      - name: Point app/target at the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = New-Item -ItemType Directory -Force -Path "$env:DEV_DRIVE/target"
          New-Item -ItemType Junction -Path target -Target $target.FullName | Out-Null

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check every app version agrees
        run: python scripts/release_version.py check
      - name: Test the release version script
        run: python -B -m unittest discover -s scripts/tests -p "test_release_version.py" -v

      - name: Install Linux serial prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # On Windows, cache the Dev Drive folder itself, not the app/target junction that points at it.
          workspaces: ${{ runner.os == 'Windows' && 'app -> ../../dev-drive/target' || 'app' }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Build the UI that the Companion embeds
        run: pnpm build:ui
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  e2e:
    name: e2e ${{ matrix.shard }}/3
    if: inputs.e2e
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter touchdeck-ui
      - name: Run the UI e2e specs on the fake Companion
        run: pnpm e2e:ui --shard=${{ matrix.shard }}/3

name: app

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check (empty means the triggering ref)
        type: string
        default: ""
      os:
        description: JSON list of runners
        type: string
        default: '["windows-latest", "ubuntu-24.04"]'

permissions:
  contents: read

concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Python on Windows decodes tool output with the ANSI code page unless told to use UTF-8.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      # Windows builds Rust on a Dev Drive: ReFS, with Defender scanning it asynchronously.
      # It mounts beside the checkout so the drive's protected System Volume Information folder stays out of the Rust cache.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 25GB
          drive-path: ${{ runner.temp }}/dev-drive.vhdx
          mount-path: ${{ github.workspace }}/../dev-drive
          trusted-dev-drive: true
      - name: Point app/target at the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = New-Item -ItemType Directory -Force -Path "$env:DEV_DRIVE/target"
          New-Item -ItemType Junction -Path target -Target $target.FullName | Out-Null

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check every app version agrees
        run: python scripts/release_version.py check
      - name: Test the release version script
        run: python -B -m unittest discover -s scripts/tests -p "test_release_version.py" -v

      - name: Install Linux serial prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # On Windows, cache the Dev Drive folder itself, not the app/target junction that points at it.
          workspaces: ${{ runner.os == 'Windows' && 'app -> ../../dev-drive/target' || 'app' }}
          # Only a push to main saves. Pull requests would evict main's cache, and a release dry run may check out any ref.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Build the UI that the Companion embeds
        run: pnpm build:ui
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Run the UI e2e specs on the fake Companion
        if: runner.os == 'Windows'
        run: pnpm e2e:ui

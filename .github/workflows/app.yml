name: app

# Pull requests run Windows only, and the old Tauri app's build and e2e only when its files change.
# Every push to main and the windows release workflow run the full matrix with the Tauri e2e.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check (empty means the triggering ref)
        type: string
        default: ""
      os:
        description: JSON list of runners
        type: string
        default: '["windows-latest", "ubuntu-24.04"]'
      tauri:
        description: Build the Tauri app and run its e2e specs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TOUCHDECK_MOCK: "1"
      TD_E2E_OUT: ${{ github.workspace }}/app/target/e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check every app version agrees
        run: python scripts/release_version.py check
      - name: Test the release version script
        run: python -B -m unittest discover -s scripts/tests -p "test_release_version.py" -v

      - name: Install the Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev xvfb

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
          # Only a push to main saves. Pull requests would evict main's cache, and a release dry run may check out any ref.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Build the frontend that tauri embeds
        run: pnpm build
      - name: Build the UI that the Companion embeds
        run: pnpm build:ui
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Run the UI e2e specs on the fake Companion
        if: runner.os == 'Windows'
        run: pnpm e2e:ui

      - if: inputs.tauri
        run: pnpm tauri build --features e2e
      - name: Run the e2e specs on the mock deck
        if: inputs.tauri && runner.os == 'Windows'
        run: pnpm e2e
      - name: Run the shared e2e specs on the mock deck under xvfb
        if: inputs.tauri && runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: app/target/e2e
          if-no-files-found: ignore

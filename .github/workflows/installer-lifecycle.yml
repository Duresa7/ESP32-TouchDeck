name: installer lifecycle

# Release-time only: the windows release workflow calls this before it publishes.
# Run it by hand from the Actions tab to check an installer change before a release.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test (empty means the triggering ref)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test (empty means the selected branch)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: installer-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The release build recipe from the same checkout; durable signing inputs stay empty.
      - name: Build and verify disposable test-signed candidate
        uses: ./.github/actions/windows-release-build
        with:
          release-mode: test-signing
          build-ref: ${{ inputs.ref || github.ref }}
          # Must differ from windows-release-assets, which the release publish job downloads.
          artifact-name: installer-lifecycle-candidate

      - name: Install, passively update, and uninstall
        shell: pwsh
        run: |
          & app/scripts/installer_lifecycle.ps1 `
            -InstallerPath "$env:RUNNER_TEMP/touchdeck-release/release-assets/TouchDeck-windows-x64-TEST-ONLY-setup.exe" `
            -ArtifactDir "$env:RUNNER_TEMP/installer-lifecycle"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installer-lifecycle
          # These are sanitized by the script; never upload profiles, settings, or signing material.
          path: |
            ${{ runner.temp }}/installer-lifecycle/summary.json
            ${{ runner.temp }}/installer-lifecycle/lifecycle.log
          if-no-files-found: warn
          retention-days: 14

name: windows release

# Release-time only. Two modes, one build recipe:
#   workflow_dispatch  dry run of a commit on main with the durable key in the release environment; never tags or releases
#   push of vX.Y.Z     durable-key build in the release environment, then the publish job releases it
# Both modes also run the app, firmware and installer lifecycle checks on the same commit,
# and the publish job waits for every one of them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag on main to build and verify with the durable key (never published)
        required: true
        default: main
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks get no secrets: none of them is passed the release environment or the signing key.
  app:
    uses: ./.github/workflows/app.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  firmware:
    uses: ./.github/workflows/firmware.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  installer-lifecycle:
    uses: ./.github/workflows/installer-lifecycle.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  build:
    # Runs pnpm packages and ESP-IDF, so it only ever holds a read token.
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    env:
      BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Python on Windows decodes tool output with the ANSI code page unless told to use UTF-8.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify built commit is on origin/main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw "Built commit $(git rev-parse HEAD) is not on origin/main." }
      - name: Build and verify durable-key release
        uses: ./.github/actions/windows-release-build
        with:
          release-mode: ${{ github.event_name == 'push' && 'publish' || 'dry-run' }}
          release-tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
          build-ref: ${{ env.BUILD_REF }}
          updater-public-key: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          signing-key-present: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    # Holds the write token, so it runs no repository or third-party build code: only gh, jq and sha256sum.
    # Nothing is published unless every check passed on the tagged commit too.
    needs: [build, app, firmware, installer-lifecycle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: windows-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      TAGGED_SHA: ${{ github.sha }}
      INSTALLER: OpenTouchDeck-windows-x64-setup.exe
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Check the downloaded assets belong to this tag
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --strict -c SHA256SUMS
          version="${RELEASE_TAG#v}"
          url="https://github.com/Duresa7/ESP32-TouchDeck/releases/download/${RELEASE_TAG}/${INSTALLER}"
          for name in "$INSTALLER" "$INSTALLER.sig" latest.json release-manifest.json; do
            [ -s "$name" ] || { echo "::error::Missing asset $name"; exit 1; }
          done
          if ls | grep -q TEST-ONLY; then echo "::error::Test-signing assets must never be published"; exit 1; fi
          [ "$(jq -r .version latest.json)" = "$version" ] || { echo "::error::latest.json version is not $version"; exit 1; }
          [ "$(jq -r '.platforms["windows-x86_64"].url' latest.json)" = "$url" ] || { echo "::error::latest.json url is not $url"; exit 1; }
          [ "$(jq -r '.platforms["windows-x86_64"].signature' latest.json)" = "$(tr -d '\r\n' < "$INSTALLER.sig")" ] \
            || { echo "::error::latest.json signature differs from $INSTALLER.sig"; exit 1; }
          [ "$(jq -r .test_signing release-manifest.json)" = "false" ] || { echo "::error::Assets were test-signed"; exit 1; }
          [ "$(jq -r .installer release-manifest.json)" = "$INSTALLER" ] || { echo "::error::Unexpected installer name"; exit 1; }
          [ "$(jq -r .source_revision release-manifest.json)" = "$TAGGED_SHA" ] || { echo "::error::Assets were not built from $TAGGED_SHA"; exit 1; }
          jq -r .notes latest.json > "$RUNNER_TEMP/release-notes.md"

      - name: Upload every asset to a draft release
        run: |
          set -euo pipefail
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; refusing to replace its assets"
              exit 1
            fi
            # A draft left by an earlier failed run: drop assets this build does not produce.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [ -f "release-assets/$name" ] || gh release delete-asset "$RELEASE_TAG" "$name" --yes
            done
            gh release edit "$RELEASE_TAG" --title "Open TouchDeck $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Open TouchDeck $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Publish only after every asset is in place
        run: |
          set -euo pipefail
          uploaded=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort)
          expected=$(cd release-assets && for name in *; do echo "$name $(stat -c %s "$name")"; done | sort)
          if [ "$uploaded" != "$expected" ]; then
            echo "::error::Uploaded assets differ from the build"
            diff <(echo "$expected") <(echo "$uploaded") || true
            exit 1
          fi
          for name in "$INSTALLER" "$INSTALLER.sig" latest.json; do
            grep -qx "$name [0-9]*" <<< "$uploaded" || { echo "::error::Release lacks $name"; exit 1; }
          done
          # Last step: releases/latest/download/latest.json moves to this release only now.
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,tagName

name: windows release

# Three modes, one build recipe:
#   pull_request       disposable test-signing candidate; no secrets, no release
#   workflow_dispatch  dry run of any ref with the durable key; never tags or releases
#   push of vX.Y.Z     durable-key build, then the publish job releases it
on:
  pull_request:
    paths:
      - .github/workflows/release-windows.yml
      - app/scripts/package_windows.py
      - app/scripts/verify_updater.py
      - app/scripts/release_version.py
      - app/src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build and verify with the durable key (never published)
        required: true
        default: main
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Runs pnpm packages and ESP-IDF, so it only ever holds a read token.
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || github.event_name == 'workflow_dispatch' && 'dry-run' || 'test-signing' }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: app/package.json

      - name: Validate release identity
        shell: pwsh
        env:
          # Booleans only: the secrets themselves stay in the signing step.
          SIGNING_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:RELEASE_MODE -eq 'publish') {
            python app/scripts/release_version.py check --tag $env:RELEASE_TAG
            if ($LASTEXITCODE) { throw 'The tag must be v plus the app version, and every app version must agree.' }
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE) { throw "Tagged commit $(git rev-parse HEAD) is not on origin/main." }
          } else {
            python app/scripts/release_version.py check
            if ($LASTEXITCODE) { throw 'Every app version must agree.' }
          }
          if ($env:RELEASE_MODE -ne 'test-signing') {
            if ($env:SIGNING_KEY_PRESENT -ne 'true') { throw 'Secret TAURI_SIGNING_PRIVATE_KEY is not configured.' }
            if (-not $env:UPDATER_PUBLIC_KEY) { throw 'Variable TAURI_UPDATER_PUBLIC_KEY is not configured.' }
          }

      - name: Write release notes and updater public key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $notes = ''
          if ($env:RELEASE_MODE -eq 'publish') {
            # Re-fetch the tag itself: the checkout can leave a lightweight copy without its message.
            git fetch --force --no-tags origin "+refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $ref = "refs/tags/$env:RELEASE_TAG"
            if ((git for-each-ref $ref --format='%(objecttype)') -eq 'tag') {
              # Subject and body only, so a signed tag's signature block never reaches the notes.
              $notes = ((git for-each-ref $ref --format='%(contents:subject)%0a%0a%(contents:body)') -join "`n").Trim()
            }
            if (-not $notes) { $notes = "TouchDeck $env:RELEASE_TAG" }
          } elseif ($env:RELEASE_MODE -eq 'dry-run') {
            $notes = "TouchDeck dry run of $env:BUILD_REF ($(git rev-parse HEAD)). Not for publication."
          } else {
            $notes = "TouchDeck test-signing candidate $(git rev-parse HEAD). Not for publication."
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/release-notes.md", "$notes`n")
          if ($env:RELEASE_MODE -ne 'test-signing') {
            [IO.File]::WriteAllText("$env:RUNNER_TEMP/updater.pub", "$($env:UPDATER_PUBLIC_KEY.Trim())`n")
          }
          Get-Content "$env:RUNNER_TEMP/release-notes.md"

      - name: Install locked build dependencies on disposable runner
        shell: pwsh
        run: |
          pnpm --dir app install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --branch v6.1 --recursive --depth 1 https://github.com/espressif/esp-idf.git "$env:RUNNER_TEMP/esp-idf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/esp-idf/install.ps1" esp32s3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build test-signed installer, helper and matching radio-free firmware
        if: env.RELEASE_MODE == 'test-signing'
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP/esp-idf/export.ps1"
          python app/scripts/package_windows.py build --out "$env:RUNNER_TEMP/touchdeck-release" --test-signing --notes-file "$env:RUNNER_TEMP/release-notes.md"
          exit $LASTEXITCODE

      - name: Build durable-key installer, helper and matching radio-free firmware
        if: env.RELEASE_MODE != 'test-signing'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . "$env:RUNNER_TEMP/esp-idf/export.ps1"
          python app/scripts/package_windows.py build --out "$env:RUNNER_TEMP/touchdeck-release" --public-key-file "$env:RUNNER_TEMP/updater.pub" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          exit $LASTEXITCODE

      - name: Verify signed installer with local HTTPS fixture without installing
        shell: pwsh
        run: |
          python app/scripts/verify_updater.py --assets "$env:RUNNER_TEMP/touchdeck-release/release-assets" --out "$env:RUNNER_TEMP/updater-fixture" --cargo-target "$env:RUNNER_TEMP/touchdeck-release/build/app" --openssl 'C:/Program Files/Git/usr/bin/openssl.exe'
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/touchdeck-release/release-assets
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_MODE == 'publish' && 90 || 14 }}

  publish:
    # Holds the write token, so it runs no repository or third-party build code: only gh, jq and sha256sum.
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: windows-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      TAGGED_SHA: ${{ github.sha }}
      INSTALLER: TouchDeck-windows-x64-setup.exe
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Check the downloaded assets belong to this tag
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --strict -c SHA256SUMS
          version="${RELEASE_TAG#v}"
          url="https://github.com/Duresa7/ESP32-TouchDeck/releases/download/${RELEASE_TAG}/${INSTALLER}"
          for name in "$INSTALLER" "$INSTALLER.sig" latest.json release-manifest.json; do
            [ -s "$name" ] || { echo "::error::Missing asset $name"; exit 1; }
          done
          if ls | grep -q TEST-ONLY; then echo "::error::Test-signing assets must never be published"; exit 1; fi
          [ "$(jq -r .version latest.json)" = "$version" ] || { echo "::error::latest.json version is not $version"; exit 1; }
          [ "$(jq -r '.platforms["windows-x86_64"].url' latest.json)" = "$url" ] || { echo "::error::latest.json url is not $url"; exit 1; }
          [ "$(jq -r '.platforms["windows-x86_64"].signature' latest.json)" = "$(tr -d '\r\n' < "$INSTALLER.sig")" ] \
            || { echo "::error::latest.json signature differs from $INSTALLER.sig"; exit 1; }
          [ "$(jq -r .test_signing release-manifest.json)" = "false" ] || { echo "::error::Assets were test-signed"; exit 1; }
          [ "$(jq -r .installer release-manifest.json)" = "$INSTALLER" ] || { echo "::error::Unexpected installer name"; exit 1; }
          [ "$(jq -r .source_revision release-manifest.json)" = "$TAGGED_SHA" ] || { echo "::error::Assets were not built from $TAGGED_SHA"; exit 1; }
          jq -r .notes latest.json > "$RUNNER_TEMP/release-notes.md"

      - name: Upload every asset to a draft release
        run: |
          set -euo pipefail
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; refusing to replace its assets"
              exit 1
            fi
            # A draft left by an earlier failed run: drop assets this build does not produce.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [ -f "release-assets/$name" ] || gh release delete-asset "$RELEASE_TAG" "$name" --yes
            done
            gh release edit "$RELEASE_TAG" --title "TouchDeck $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "TouchDeck $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Publish only after every asset is in place
        run: |
          set -euo pipefail
          uploaded=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort)
          expected=$(cd release-assets && for name in *; do echo "$name $(stat -c %s "$name")"; done | sort)
          if [ "$uploaded" != "$expected" ]; then
            echo "::error::Uploaded assets differ from the build"
            diff <(echo "$expected") <(echo "$uploaded") || true
            exit 1
          fi
          for name in "$INSTALLER" "$INSTALLER.sig" latest.json; do
            grep -qx "$name [0-9]*" <<< "$uploaded" || { echo "::error::Release lacks $name"; exit 1; }
          done
          # Last step: releases/latest/download/latest.json moves to this release only now.
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,tagName

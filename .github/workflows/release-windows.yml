name: windows release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag on main to build and verify with the durable key (never published)
        required: true
        default: main
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    uses: ./.github/workflows/app.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  firmware:
    uses: ./.github/workflows/firmware.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  installer-lifecycle:
    uses: ./.github/workflows/installer-lifecycle.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      installer-sha256: ${{ steps.unsigned.outputs.installer-sha256 }}
      source-revision: ${{ steps.source.outputs.revision }}
    env:
      BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Python on Windows decodes tool output with the ANSI code page unless told to use UTF-8.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify built commit is on origin/main
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw "Built commit $(git rev-parse HEAD) is not on origin/main." }
          "revision=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Build unsigned release
        id: unsigned
        uses: ./.github/actions/windows-release-build
        with:
          release-mode: ${{ github.event_name == 'push' && 'publish' || 'dry-run' }}
          release-tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
          build-ref: ${{ env.BUILD_REF }}
          updater-public-key: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          artifact-name: windows-release-unsigned

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      INSTALLER: OpenTouchDeck-windows-x64-setup.exe
      EXPECTED_SHA256: ${{ needs.build.outputs.installer-sha256 }}
      SOURCE_REVISION: ${{ needs.build.outputs.source-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: .github/release-signer
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install only the locked signer without lifecycle scripts
        run: npm ci --prefix .github/release-signer --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-unsigned
          path: release-assets
      - name: Check build hash and version
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "$EXPECTED_SHA256  release-assets/$INSTALLER" | sha256sum --strict -c -
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          committed_version=$(git show "$SOURCE_REVISION:app/electron/package.json" | jq -er .version)
          version=$(jq -r .version release-assets/release-manifest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$version" = "$committed_version" ]
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$version" = "${GITHUB_REF_NAME#v}" ]
          fi
          jq -e --arg sha "$EXPECTED_SHA256" --arg revision "$SOURCE_REVISION" '
            .test_signing == false and .source_revision == $revision and
            ((has("installer_sha256") | not) or .installer_sha256 == $sha)
          ' release-assets/release-manifest.json >/dev/null
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Sign the checked installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node .github/release-signer/node_modules/@tauri-apps/cli/tauri.js signer sign \
            --app-version "$RELEASE_VERSION" "release-assets/$INSTALLER" >/dev/null 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-signature
          path: release-assets/*.sig
          if-no-files-found: error

  verify:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_SHA256: ${{ needs.build.outputs.installer-sha256 }}
      UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source-revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-unsigned
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-signature
          path: release-assets
      - name: Verify signed installer through local HTTPS
        run: |
          set -euo pipefail
          pnpm --dir app install --frozen-lockfile
          pnpm --dir app --filter @touchdeck/electron build
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/tls.key" \
            -out "$RUNNER_TEMP/tls.crt" -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/tls.crt" node app/scripts/verify_release.mjs \
            release-assets "$RUNNER_TEMP/tls.key" "$RUNNER_TEMP/tls.crt"

  publish:
    needs: [build, sign, verify, app, firmware, installer-lifecycle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: windows-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      TAGGED_SHA: ${{ needs.build.outputs.source-revision }}
      EXPECTED_SHA256: ${{ needs.build.outputs.installer-sha256 }}
      UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      INSTALLER: OpenTouchDeck-windows-x64-setup.exe
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-unsigned
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-signature
          path: signed-assets

      - name: Check the downloaded assets belong to this tag
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --strict -c SHA256SUMS
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "$EXPECTED_SHA256  $INSTALLER" | sha256sum --strict -c -
          version="${RELEASE_TAG#v}"
          jq -e --arg version "$version" --arg sha "$EXPECTED_SHA256" \
            --arg revision "$TAGGED_SHA" --arg installer "$INSTALLER" --arg key "$UPDATER_PUBLIC_KEY" '
            .version == $version and .test_signing == false and .installer == $installer and
            .source_revision == $revision and .installer_sha256 == $sha and .updater_public_key == $key
          ' release-manifest.json >/dev/null
          cp "../signed-assets/$INSTALLER.sig" "$INSTALLER.sig"
          [ -s "$INSTALLER.sig" ]
          tag=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")
          [ "$(jq -r .object.type <<< "$tag")" = tag ]
          annotation=$(gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<< "$tag")")
          [ "$(jq -r .object.type <<< "$annotation")" = commit ]
          [ "$(jq -r .object.sha <<< "$annotation")" = "$TAGGED_SHA" ]
          jq -r '.message | split("-----BEGIN PGP SIGNATURE-----")[0] | split("-----BEGIN SSH SIGNATURE-----")[0] | sub("\\s+$"; "")' <<< "$annotation" > "$RUNNER_TEMP/release-notes.md"
          jq -n --arg version "$version" --rawfile notes "$RUNNER_TEMP/release-notes.md" \
            --arg date "$(jq -r .tagger.date <<< "$annotation")" \
            --arg signature "$(tr -d '\r\n' < "$INSTALLER.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$INSTALLER" \
            --argjson size "$(stat -c %s "$INSTALLER")" '
            {version: $version, notes: $notes, pub_date: $date,
             platforms: {"windows-x86_64": {signature: $signature, url: $url, size: $size}}}
          ' > latest.json
          rm SHA256SUMS
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS

      - name: Upload every asset to a draft release
        run: |
          set -euo pipefail
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; refusing to replace its assets"
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [ -f "release-assets/$name" ] || gh release delete-asset "$RELEASE_TAG" "$name" --yes
            done
            gh release edit "$RELEASE_TAG" --title "Open TouchDeck $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Open TouchDeck $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Check draft assets
        run: |
          set -euo pipefail
          uploaded=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort)
          expected=$(cd release-assets && for name in *; do echo "$name $(stat -c %s "$name")"; done | sort)
          if [ "$uploaded" != "$expected" ]; then
            echo "::error::Uploaded assets differ from the build"
            diff <(echo "$expected") <(echo "$uploaded") || true
            exit 1
          fi
          for name in "$INSTALLER" "$INSTALLER.sig" latest.json; do
            grep -qx "$name [0-9]*" <<< "$uploaded" || { echo "::error::Release lacks $name"; exit 1; }
          done
          gh release view "$RELEASE_TAG" --json url,isDraft,tagName

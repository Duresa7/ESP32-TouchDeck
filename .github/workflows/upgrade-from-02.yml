name: upgrade from 0.2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upgrade-from-02.yml
      - .github/actions/windows-release-build/**
      - app/scripts/upgrade_from_02.ps1
      - app/scripts/tests/test_upgrade_from_02.py
      - app/scripts/package_windows.py
      - app/electron/build/**
      - docs/usage.md

permissions:
  contents: read

jobs:
  upgrade-from-02:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the hosted-runner boundary
        shell: pwsh
        run: python -B -m unittest discover -s app/scripts/tests -p test_upgrade_from_02.py
      - uses: ./.github/actions/windows-release-build
        with:
          release-mode: test-signing
          build-ref: ${{ github.ref }}
          artifact-name: upgrade-from-02-candidate
      - name: Replace the published Tauri app by hand
        shell: pwsh
        run: |
          & app/scripts/upgrade_from_02.ps1 -AssetsDir "$env:RUNNER_TEMP/touchdeck-release/release-assets"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upgrade-from-02-facts
          path: ${{ runner.temp }}/upgrade-from-02/facts.json
          if-no-files-found: warn
          retention-days: 14
